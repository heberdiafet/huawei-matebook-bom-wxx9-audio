Syntax 6

# Override local (alsa-ucm-conf 1.2.14-1) — HUAWEI BOM-WXX9 / acp3x-es83xx
# Objetivo: cadena de ganancia a escala completa y un único control de
# volumen analógico (Headphone Mixer), sin que WirePlumber mueva también el DAC.

Define.DeviceDmic "$${find-device:type=pcm,stream=capture,field=id,regex='dmic'}"

BootSequence [
	# Setup muxes / switches
	cset "name='Left Headphone Mixer Left DAC Switch' on"
	cset "name='Right Headphone Mixer Right DAC Switch' on"
	cset "name='Digital Mic Mux' 0"

	# Cadena de salida a 0 dB (escala completa)
	cset "name='DAC Playback Volume' 100%"
	cset "name='Headphone Playback Volume' 100%"
	cset "name='Headphone Mixer Volume' 100%"

	# LDATA TO LDAC, RDATA TO RDAC
	cset "name='DAC Source Mux' 0"

	# Disable Auto Level Control
	cset "name='ALC Capture Switch' off"

	# Set capture vol
	cset "name='ADC Capture Volume' 70%"
]

SectionUseCase."HiFi" {
	File "/AMD/acp3x-es83xx/HiFi.conf"
	Comment "Play and record HiFi quality Music"
}
