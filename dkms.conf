PACKAGE_NAME="huawei-hpfix"
PACKAGE_VERSION="1.0.0"

# Only the patched AMD ACP3x legacy machine driver is built/installed;
# the codec, ACP core and ACP-PCI drivers stay as shipped by the distro.
BUILT_MODULE_NAME[0]="snd-acp-legacy-mach"
BUILT_MODULE_LOCATION[0]="."
DEST_MODULE_LOCATION[0]="/updates/dkms"

# dkms 3.x prepends "./patches/" to every PATCH entry, so only the bare
# file name belongs here. The quirk sets the headphone-enable GPIO to
# active-low on HUAWEI BOM-WXX9 (M1010).
PATCH[0]="0001-hp-active-low.patch"

AUTOINSTALL="yes"
